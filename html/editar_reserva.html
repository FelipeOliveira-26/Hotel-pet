<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet  Editar Reserva</title>

    <link rel="stylesheet" href="/css/editar_reserva.css">

</head>

<body>
    
        <h1>Hotel Pet</h1>

        <!-- Menu lateral -->

            <a href="tela_pet.html">
                 Pet
            </a>

            <a href="tela_usuario.html">
                 Usuários
            </a>

            <a href="tela_configuracoes.html">
                 Configurações
            </a>

            <a href="tela_reserva.html">
                 Reservas
            </a>

    <main>

        <!-- Cabeçalho -->
        <header>

            <span>
                Home / Reservas / Editar reserva
            </span>

            <div>

                <span>
                    João da Silva
                </span>

            </div>

        </header>


        <!-- Formulário -->
        

            <h2>Editar reserva</h2>

            <form>

                <!-- Proprietário -->
                <div>

                    <label for="proprietario">
                        Proprietário *
                    </label>

                    <input
                        type="text"
                        id="proprietario"
                        name="proprietario"
                        required
                    >

                </div>


                <!-- Pet -->
                <div>

                    <label for="pet">
                        Pet *
                    </label>

                    <input
                        type="text"
                        id="pet"
                        name="pet"
                        required
                    >

                </div>


                <!-- Período -->
                <div>

                    <label for="data_inicio">
                        Período *
                    </label>

                    <br>

                    <input
                        type="date"
                        id="data_inicio"
                        name="data_inicio"
                        required
                    >

                    <input
                        type="date"
                        id="data_fim"
                        name="data_fim"
                        required
                    >

                </div>


                <!-- Notas -->
                <div>

                    <label for="notas">
                        Notas
                    </label>

                    <br>

                    <textarea
                        id="notas"
                        name="notas"
                        rows="5"
                    ></textarea>

                </div>


                <!-- Status -->
                <div>

                    <label for="status">
                        Status *
                    </label>

                    <br>

                    <select
                        id="status"
                        name="status"
                        required
                    >

                        <option value="reservado" selected>
                            Reservado
                        </option>

                        <option value="andamento">
                            Em andamento
                        </option>

                        <option value="cancelado">
                            Cancelado
                        </option>

                        <option value="finalizado">
                            Finalizado
                        </option>

                    </select>

                </div>


                <!-- Total -->
                <p>

                    Total das diárias:

                    <span>
                        R$ 40,00
                    </span>

                </p>


                <!-- Botões -->
                <div>
                    <button type="submit">
                         Salvar
                    </button>
                    <button type="reset">
                         Limpar
                    </button>

                </div>

            </form>


    </main>

</body>

</html>
