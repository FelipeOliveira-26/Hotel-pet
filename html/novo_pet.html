<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet  Novo Pet</title>

    <link rel="stylesheet" href="/css/novo_pet.css"
</head>

<body>

    <!-- menu lateral -->
    <aside>

        <h1>Hotel Pet</h1>

            <a href="tela_pet.html">
                 Pet
            </a>

            <a href="tela_usuario.html">
                 Usuários
            </a>

            <a href="tela_configuracoes.html">
                 Configurações
            </a>

            <a href="tela_reserva.html">
                 Reservas
            </a>


    </aside>


    
    <main>

        <!-- cabeçalho -->
        <header>

            <span>
                Home / Pet / Novo Pet
            </span>

            <div>

                <span>
                    João da Silva
                </span>

            </div>

        </header>


        <!-- formulário novo pet -->
        <div>

            <h2>Novo Pet</h2>


            <form>

                <!-- campos do formulário -->
                <div>

                    <div>

                        <label for="proprietario">Proprietário *</label>
                        <input type="text" id="proprietario" name="proprietario" required>

                    </div>

                    <div>

                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" required>

                    </div>

                    <div>

                        <label for="tipo">Tipo *</label>
                        <select id="tipo" name="tipo" required>
                            <option value="" disabled selected></option>
                            <option value="cachorro">Cachorro</option>
                            <option value="gato">Gato</option>
                        </select>

                    </div>

                    <div>

                        <label for="raca">Raça *</label>
                        <input type="text" id="raca" name="raca" required>

                    </div>

                    <div>

                        <label for="tamanho">Tamanho *</label>
                        <select id="tamanho" name="tamanho" required>
                            <option value="" disabled selected></option>
                            <option value="pequeno">Pequeno</option>
                            <option value="medio">Médio</option>
                            <option value="grande">Grande</option>
                        </select>

                    </div>

                </div>


                <!-- botões -->
                <div>

                    <button type="submit">
                         Salvar
                    </button>

                    <button type="reset">
                         Limpar
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
