<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Ver Pet</title>
     
    <link rel="stylesheet" href="/css/visualizar_pet.css">

<body>

    <!-- menu lateral -->
    <aside>

            <a href="tela_reserva.html">

    </aside>


    
    <main>

            <div>

                </span>

            </div>
