<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet  Pets</title>

    <link rel="stylesheet" href="/css/tela_pet.css">
</head>

<body>


        <h1>Hotel Pet</h1>
          
          <!-- menu lateral -->

            <a href="tela_pet.html">
                 Pets
            </a>

            <a href="tela_usuario.html">
                 Usuários
            </a>

            <a href="tela_configuracoes.html">
                 Configurações
            </a>

            <a href="tela_reserva.html">
                 Reservas
            </a>

    
    <main>

        <!-- cabeçalho -->
        <header>

            <span>
                Home / Pets
            </span>

            <div>

                <span>
                    João da Silva
                </span>

            </div>

        </header>


        <!-- listagem de pets -->
        <div>

            <h2>Pets</h2>


            <!-- botão novo pet -->
            
              <a href="/html/novo_pet.html">
              <button type="button">
                + Novo Pet
              </button>
              </a>

            <!-- filtros de pesquisa -->
            <form id="formFiltroPets">

                <div>

                    <label for="id">Id</label>
                    <input type="text" id="id" name="id">

                    <label for="raca">raça</label>
                    <input type="text" id="raca" name="raca">

                </div>

                <div>

                    <label for="nome">nome</label>
                    <input type="text" id="nome" name="nome">

                   <label for="tamanho">tamanho</label>
                        <select id="tamanho" name="tamanho">
                            <option value="">Selecione</option>
                            <option value="pequeno">Pequeno</option>
                            <option value="medio">Médio</option>
                            <option value="grande">Grande</option>
                        </select>

                </div>


                <div>

                    <button type="submit">
                         Pesquisar
                    </button>

                    <button type="reset">
                         Limpar
                    </button>

                </div>

            </form>
                     <table>
                            <thead>
                       <tr>
                            <th>Id</th>
                            <th>Nome</th>
                            <th>Proprietário</th>
                            <th>Tipo</th>
                            <th>Raça</th>
                            <th>Tamanho</th>
                            <th>Ações</th>
                      </tr>
                            </thead>

                           <tbody id="listaPets"></tbody>
                    </table>

        </div>

    </main>
<script src="/JS/pets.js" defer></script>
</body>

</html>
